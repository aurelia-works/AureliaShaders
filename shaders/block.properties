# Block IDs Iris feeds to mc_Entity.x. Only the shadow pass reads them.
#
# 10001: short plants. gbuffers_terrain.vsh lights them with an up normal, and
# they do not cast shadows (shadow.vsh collapses them):
# every grass/flower X-model otherwise stamps a hard dark cross on the block
# below, which in game blotched whole meadows and read far darker than the
# Complementary reference. They still RECEIVE shadows from real casters.
# 1.20.1 calls short grass `grass`; `short_grass` covers 1.20.3+ names.
block.10001=grass short_grass fern tall_grass large_fern dead_bush seagrass tall_seagrass \
 dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip \
 oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower pink_petals \
 sunflower lilac rose_bush peony sweet_berry_bush

# 10002: leaves. Lit with an up normal like plants (soft, all-round foliage, as
# MakeUp/Complementary do) but they DO cast shadows.
block.10002=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves \
 mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves
