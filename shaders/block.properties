# Block IDs Iris feeds to mc_Entity.x. Read by the terrain and shadow vertex
# stages (lib/terrain_vertex.glsl, shadow.vsh, lib/waving.glsl).
#
# Plants (10001, 10003, 10004). The terrain pass lights them with an up normal,
# and they do not cast shadows (shadow.vsh collapses them): every grass/flower
# X-model otherwise stamps a hard dark cross on the block below, which in game
# blotched whole meadows and read far darker than the Complementary reference.
# They still RECEIVE shadows from real casters.
# 1.20.1 calls short grass `grass`; `short_grass` covers 1.20.3+ names.
#
# 10001: one-block plants and the LOWER half of two-block plants. Under
# AURELIA_WAVING their top edge sways; the base stays planted.
block.10001=grass short_grass fern dead_bush seagrass \
 dandelion poppy blue_orchid allium azure_bluet red_tulip orange_tulip white_tulip pink_tulip \
 oxeye_daisy cornflower lily_of_the_valley wither_rose torchflower sweet_berry_bush \
 tall_grass:half=lower large_fern:half=lower tall_seagrass:half=lower \
 sunflower:half=lower lilac:half=lower rose_bush:half=lower peony:half=lower

# 10003: flat ground cover. Plant lighting and no shadow, but no sway.
block.10003=pink_petals

# 10004: the UPPER half of two-block plants. Its bottom edge sways exactly as
# far as the lower half's top edge (so the two stay joined) and its top twice
# as far.
block.10004=tall_grass:half=upper large_fern:half=upper tall_seagrass:half=upper \
 sunflower:half=upper lilac:half=upper rose_bush:half=upper peony:half=upper

# 10002: leaves. Lit with an up normal like plants (soft, all-round foliage, as
# MakeUp/Complementary do) but they DO cast shadows, and sway gently as a whole.
block.10002=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves \
 mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves

# --- Materials (Phase 5 realism) -------------------------------------------
# lib/materials.glsl turns these IDs into a surface response: water and glass
# get their own translucent shading, emitters glow, and the city materials get
# a smoothness and reflectance instead of the default rough, dielectric one.
# Every block without an ID here is rough stone-like ground (the default).

# 10010: water. gbuffers_water draws every translucent block, so without this
# ID stained glass, ice and slime would be shaded as waves.
block.10010=water bubble_column

# 10011: stained glass (translucent layer): a thin tinted, polished sheet.
block.10011=white_stained_glass orange_stained_glass magenta_stained_glass light_blue_stained_glass \
 yellow_stained_glass lime_stained_glass pink_stained_glass gray_stained_glass \
 light_gray_stained_glass cyan_stained_glass purple_stained_glass blue_stained_glass \
 brown_stained_glass green_stained_glass red_stained_glass black_stained_glass \
 white_stained_glass_pane orange_stained_glass_pane magenta_stained_glass_pane \
 light_blue_stained_glass_pane yellow_stained_glass_pane lime_stained_glass_pane \
 pink_stained_glass_pane gray_stained_glass_pane light_gray_stained_glass_pane \
 cyan_stained_glass_pane purple_stained_glass_pane blue_stained_glass_pane \
 brown_stained_glass_pane green_stained_glass_pane red_stained_glass_pane \
 black_stained_glass_pane tinted_glass

# 10012: clear glass (cutout layer): the frame is opaque, the pane is a hole.
block.10012=glass glass_pane

# 10013: translucent ice. 10014: slime and honey.
block.10013=ice frosted_ice
block.10014=slime_block honey_block

# 10015: nether portal: emissive translucent.
block.10015=nether_portal

# 10020: full-block light sources. Their own texture is the emission.
block.10020=glowstone sea_lantern shroomlight jack_o_lantern redstone_lamp:lit=true \
 ochre_froglight verdant_froglight pearlescent_froglight beacon end_rod magma_block \
 respawn_anchor:charges=1 respawn_anchor:charges=2 respawn_anchor:charges=3 respawn_anchor:charges=4

# 10021: lava. 10022: flames and small lamps (only their bright texels glow).
block.10021=lava
block.10022=torch wall_torch soul_torch soul_wall_torch lantern soul_lantern \
 campfire:lit=true soul_campfire:lit=true fire soul_fire redstone_torch:lit=true \
 redstone_wall_torch:lit=true candle:lit=true

# 10030: metals.
block.10030=iron_block gold_block netherite_block iron_bars iron_door iron_trapdoor chain anvil \
 chipped_anvil damaged_anvil cauldron hopper lightning_rod heavy_weighted_pressure_plate \
 light_weighted_pressure_plate bell copper_block cut_copper cut_copper_slab \
 cut_copper_stairs exposed_copper exposed_cut_copper exposed_cut_copper_slab \
 exposed_cut_copper_stairs weathered_copper weathered_cut_copper weathered_cut_copper_slab \
 weathered_cut_copper_stairs oxidized_copper oxidized_cut_copper oxidized_cut_copper_slab \
 oxidized_cut_copper_stairs waxed_copper_block waxed_cut_copper waxed_cut_copper_slab \
 waxed_cut_copper_stairs waxed_exposed_copper waxed_exposed_cut_copper \
 waxed_exposed_cut_copper_slab waxed_exposed_cut_copper_stairs waxed_weathered_copper \
 waxed_weathered_cut_copper waxed_weathered_cut_copper_slab \
 waxed_weathered_cut_copper_stairs waxed_oxidized_copper waxed_oxidized_cut_copper \
 waxed_oxidized_cut_copper_slab waxed_oxidized_cut_copper_stairs

# 10031: polished and smooth stone: floors, plazas, facades.
block.10031=polished_andesite polished_andesite_slab polished_andesite_stairs polished_diorite \
 polished_diorite_slab polished_diorite_stairs polished_granite polished_granite_slab \
 polished_granite_stairs polished_blackstone polished_blackstone_slab \
 polished_blackstone_stairs polished_deepslate polished_deepslate_slab \
 polished_deepslate_stairs smooth_quartz smooth_quartz_slab smooth_quartz_stairs \
 smooth_sandstone smooth_sandstone_slab smooth_sandstone_stairs smooth_red_sandstone \
 smooth_red_sandstone_slab smooth_red_sandstone_stairs polished_tuff polished_tuff_slab \
 polished_tuff_stairs quartz_bricks smooth_stone smooth_stone_slab quartz_block quartz_slab \
 quartz_stairs quartz_pillar chiseled_quartz_block polished_basalt

# 10032: concrete. 10033: glazed terracotta. 10035: obsidian.
block.10032=white_concrete orange_concrete magenta_concrete light_blue_concrete yellow_concrete \
 lime_concrete pink_concrete gray_concrete light_gray_concrete cyan_concrete \
 purple_concrete blue_concrete brown_concrete green_concrete red_concrete black_concrete
block.10033=white_glazed_terracotta orange_glazed_terracotta magenta_glazed_terracotta \
 light_blue_glazed_terracotta yellow_glazed_terracotta lime_glazed_terracotta \
 pink_glazed_terracotta gray_glazed_terracotta light_gray_glazed_terracotta \
 cyan_glazed_terracotta purple_glazed_terracotta blue_glazed_terracotta \
 brown_glazed_terracotta green_glazed_terracotta red_glazed_terracotta \
 black_glazed_terracotta
block.10035=obsidian crying_obsidian

# 10036: soil and sand. 10037: turf. Rain soaks in or runs through rather
# than standing on them: they darken but never glaze over or hold puddles
# (lib/lighting.glsl), so a lawn in the rain does not mirror the street.
block.10036=dirt coarse_dirt rooted_dirt sand red_sand suspicious_sand
block.10037=grass_block podzol mycelium moss_block

# Opaque ice (AURELIA_OPAQUE_ICE): plain ice moves from the translucent layer to
# the solid one, so it is drawn opaque in gbuffers_terrain_solid with no
# blending and no translucent sorting. Iris 1.7.6 reads `layer.` overrides
# here and preprocesses this file with the pack's options.
#ifdef AURELIA_OPAQUE_ICE
layer.solid=ice
#endif
