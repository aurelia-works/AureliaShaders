# Aurelia Phase 1. Custom uniforms are CPU-evaluated by Iris, avoiding history
# buffers or compute shaders (compute is unavailable in macOS OpenGL).

# 8 ticks reacts to worsening frame time; 80 ticks recovers slowly. This is
# intentional hysteresis, not instantaneous-FPS switching.
uniform.float.aureliaSmoothedFrameTime = smooth(601, frameTime, 8, 80)

# Quality schedule: grow 0.70 -> 1.00 above 50 FPS; hold at 0.70 from
# 38-50 FPS; fall 0.70 -> 0.20 from 38-30 FPS; drop to 0 below 30 FPS.
uniform.float.aureliaAdaptiveQuality = if(aureliaSmoothedFrameTime <= 0.020, 0.70 + 0.30 * clamp((0.020 - aureliaSmoothedFrameTime) / 0.004, 0.0, 1.0), if(aureliaSmoothedFrameTime <= 0.026316, 0.70, if(aureliaSmoothedFrameTime <= 0.033333, 0.20 + 0.50 * (0.033333 - aureliaSmoothedFrameTime) / 0.007017, 0.0)))
# Adaptive has a deliberately wide hold band: 38-50 FPS remains four PCF taps.
# The 1/4/9 values are a diagnostic/runtime budget, never map reallocation.
uniform.float.aureliaAdaptiveShadowFilterSamples = if(aureliaAdaptiveQuality < 0.30, 1.0, if(aureliaAdaptiveQuality < 0.82, 4.0, 9.0))

# Iris 1.7.x uses one legacy shadow program. Keep translucent geometry out of
# the caster pass: Phase 2A has no water/transparency shadow treatment.
# Culling avoids rendering non-casters into the map on integrated GPUs.
oldLighting = false
separateAo = true
#ifdef AURELIA_SHADOWS
shadow.enabled = true
#else
shadow.enabled = false
#endif
shadowTerrain = true
shadowTranslucent = false
shadowEntities = true
shadowBlockEntities = true
shadow.culling = true

screen = <empty> <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [WATER] [ADAPTIVE] [DEBUG]
screen.columns = 2
screen.LIGHTING = AURELIA_DIRECT_LIGHT AURELIA_NIGHT_LIFT AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR
screen.SHADOWS = AURELIA_SHADOWS AURELIA_SHADOW_RESOLUTION AURELIA_SHADOW_DISTANCE AURELIA_SHADOW_FILTER_MAX AURELIA_SHADOW_STRENGTH
screen.ATMOSPHERE = AURELIA_SKY_SATURATION AURELIA_FOG_DENSITY
screen.WATER = AURELIA_WATER_SURFACE
screen.ADAPTIVE = AURELIA_ADAPTIVE AURELIA_SHADOW_ADAPTIVE
screen.DEBUG = AURELIA_DEBUG_VIEW

sliders = AURELIA_DIRECT_LIGHT AURELIA_NIGHT_LIFT AURELIA_SHADOW_STRENGTH AURELIA_SKY_SATURATION AURELIA_FOG_DENSITY AURELIA_DEBUG_VIEW

# Profiles set reload-bound presentation/resource controls. Runtime-safe
# secondary effects consume the CPU-side adaptive quality scalar instead of
# reallocating compile-time resources every frame.
profile.POTATO = !AURELIA_WATER_SURFACE !AURELIA_FOLIAGE_TRANSLUCENCY !AURELIA_WETNESS_SPECULAR AURELIA_DIRECT_LIGHT=0.85 AURELIA_NIGHT_LIFT=0.22 AURELIA_SKY_SATURATION=0.85 AURELIA_FOG_DENSITY=0.85 !AURELIA_ADAPTIVE !AURELIA_SHADOWS !AURELIA_SHADOW_ADAPTIVE AURELIA_SHADOW_RESOLUTION=512 AURELIA_SHADOW_DISTANCE=64 AURELIA_SHADOW_FILTER_MAX=1 AURELIA_SHADOW_STRENGTH=0.70 AURELIA_DEBUG_VIEW=0
profile.LOW = AURELIA_WATER_SURFACE AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR AURELIA_DIRECT_LIGHT=0.90 AURELIA_NIGHT_LIFT=0.20 AURELIA_SKY_SATURATION=0.95 AURELIA_FOG_DENSITY=0.90 AURELIA_ADAPTIVE AURELIA_SHADOWS !AURELIA_SHADOW_ADAPTIVE AURELIA_SHADOW_RESOLUTION=512 AURELIA_SHADOW_DISTANCE=64 AURELIA_SHADOW_FILTER_MAX=1 AURELIA_SHADOW_STRENGTH=0.70 AURELIA_DEBUG_VIEW=0
profile.BALANCED = AURELIA_WATER_SURFACE AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR AURELIA_DIRECT_LIGHT=1.00 AURELIA_NIGHT_LIFT=0.16 AURELIA_SKY_SATURATION=1.05 AURELIA_FOG_DENSITY=1.00 AURELIA_ADAPTIVE AURELIA_SHADOWS !AURELIA_SHADOW_ADAPTIVE AURELIA_SHADOW_RESOLUTION=1024 AURELIA_SHADOW_DISTANCE=96 AURELIA_SHADOW_FILTER_MAX=2 AURELIA_SHADOW_STRENGTH=0.82 AURELIA_DEBUG_VIEW=0
profile.CINEMATIC = AURELIA_WATER_SURFACE AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR AURELIA_DIRECT_LIGHT=1.15 AURELIA_NIGHT_LIFT=0.12 AURELIA_SKY_SATURATION=1.15 AURELIA_FOG_DENSITY=1.20 AURELIA_ADAPTIVE AURELIA_SHADOWS !AURELIA_SHADOW_ADAPTIVE AURELIA_SHADOW_RESOLUTION=1536 AURELIA_SHADOW_DISTANCE=128 AURELIA_SHADOW_FILTER_MAX=3 AURELIA_SHADOW_STRENGTH=0.90 AURELIA_DEBUG_VIEW=0
profile.ADAPTIVE = AURELIA_WATER_SURFACE AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR AURELIA_DIRECT_LIGHT=1.00 AURELIA_NIGHT_LIFT=0.16 AURELIA_SKY_SATURATION=1.05 AURELIA_FOG_DENSITY=1.00 AURELIA_ADAPTIVE AURELIA_SHADOWS AURELIA_SHADOW_ADAPTIVE AURELIA_SHADOW_RESOLUTION=1024 AURELIA_SHADOW_DISTANCE=96 AURELIA_SHADOW_FILTER_MAX=3 AURELIA_SHADOW_STRENGTH=0.82 AURELIA_DEBUG_VIEW=0
