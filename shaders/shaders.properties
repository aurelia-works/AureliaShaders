# Aurelia Shaders. Custom uniforms are CPU-evaluated by Iris, avoiding history
# buffers or compute shaders (compute is unavailable in macOS OpenGL).

# 8 ticks reacts to worsening frame time; 80 ticks recovers slowly. This is
# intentional hysteresis, not instantaneous-FPS switching.
uniform.float.aureliaSmoothedFrameTime = smooth(601, frameTime, 8, 80)

# Quality schedule: grow 0.70 -> 1.00 above 50 FPS; hold at 0.70 from
# 38-50 FPS; fall 0.70 -> 0.20 from 38-30 FPS; drop to 0 below 30 FPS.
uniform.float.aureliaAdaptiveQuality = if(aureliaSmoothedFrameTime <= 0.020, 0.70 + 0.30 * clamp((0.020 - aureliaSmoothedFrameTime) / 0.004, 0.0, 1.0), if(aureliaSmoothedFrameTime <= 0.026316, 0.70, if(aureliaSmoothedFrameTime <= 0.033333, 0.20 + 0.50 * (0.033333 - aureliaSmoothedFrameTime) / 0.007017, 0.0)))
# Debug-view-6 tier label (1 / 4 / 9), never a map reallocation. It is a tier
# name, not a fetch count: with hardware-compared PCF (lib/shadows.glsl) the
# real cost is 1 / 1 / 4 fetches, and only sustained headroom above 0.82 (the
# top tier) reaches the four-fetch tent, and only at AURELIA_SHADOW_FILTER_MAX=3.
uniform.float.aureliaAdaptiveShadowFilterSamples = if(aureliaAdaptiveQuality < 0.30, 1.0, if(aureliaAdaptiveQuality < 0.82, 4.0, 9.0))

# Iris 1.7.x uses one legacy shadow program. Keep translucent geometry out of
# the caster pass: the pack has no water/transparency shadow treatment.
# Culling avoids rendering non-casters into the map on integrated GPUs.
oldLighting = false
separateAo = true
# The sun and moon discs are analytic (lib/sky.glsl) and gbuffers_skytextured
# already blanks the vanilla quads; telling Iris not to draw them at all is a
# zero-cost backstop that also skips the draw calls. Textured skies (End box,
# resource-pack skies) are unaffected.
sun = false
moon = false
# Shadows off (Potato): leave the legacy caster pass nothing to draw, so the
# map costs only its clear even if the driver still allocates it.
#ifdef AURELIA_SHADOWS
shadow.enabled = true
shadowTerrain = true
shadowEntities = true
shadowBlockEntities = true
#else
shadow.enabled = false
shadowTerrain = false
shadowEntities = false
shadowBlockEntities = false
#endif
shadowTranslucent = false
shadow.culling = true

screen = <empty> <profile> <empty> [LIGHTING] [SHADOWS] [ATMOSPHERE] [WATER] [WEATHER] [POST] [ADAPTIVE] [DEBUG]
screen.columns = 2
screen.LIGHTING = AURELIA_DIRECT_LIGHT AURELIA_NIGHT_LIFT AURELIA_FOLIAGE_TRANSLUCENCY AURELIA_WETNESS_SPECULAR
screen.SHADOWS = AURELIA_SHADOWS AURELIA_SHADOW_RESOLUTION AURELIA_SHADOW_DISTANCE AURELIA_SHADOW_FILTER_MAX AURELIA_SHADOW_STRENGTH
screen.ATMOSPHERE = AURELIA_ATMOSPHERE AURELIA_CLOUDS_SOFT AURELIA_SKY_SATURATION AURELIA_FOG_DENSITY
screen.WATER = AURELIA_WATER_SURFACE AURELIA_WATER_ANIMATED AURELIA_WATER_DEPTH AURELIA_WATER_SHORE AURELIA_WATER_UNDERWATER
screen.WEATHER = AURELIA_DISTANT_RAIN AURELIA_DISTANT_RAIN_LAYERS
screen.POST = AURELIA_EXPOSURE AURELIA_CONTRAST
screen.ADAPTIVE = AURELIA_ADAPTIVE AURELIA_SHADOW_ADAPTIVE
screen.DEBUG = AURELIA_DEBUG_VIEW

sliders = AURELIA_DIRECT_LIGHT AURELIA_NIGHT_LIFT AURELIA_SHADOW_STRENGTH AURELIA_SKY_SATURATION AURELIA_FOG_DENSITY AURELIA_EXPOSURE AURELIA_CONTRAST AURELIA_DEBUG_VIEW AURELIA_DISTANT_RAIN_LAYERS

# Profiles set reload-bound presentation/resource controls. Runtime-safe
# secondary effects consume the CPU-side adaptive quality scalar instead of
# reallocating compile-time resources every frame.
